name: daily-market-batch
on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare daily batch metadata
        shell: bash
        run: |
          mkdir -p batch_logs
          date -u +%Y-%m-%dT%H:%M:%SZ > batch_logs/last_run_utc.txt
          echo '{"status":"ready","note":"Source refresh adapters are configured separately; last verified data is preserved on failure."}' > batch_logs/status.json
      - name: Commit batch status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batch_logs
          git diff --cached --quiet || git commit -m "Update daily batch status"
          git push